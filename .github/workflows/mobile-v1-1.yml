name: SmartProBono mobile v1.1 checks

on:
  push:
    branches:
      - feature/mobile-v1-1-trust-upgrades
    paths:
      - 'SmartProBonoPocket/**'
      - '.github/workflows/mobile-v1-1.yml'
  workflow_dispatch:

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartProBonoPocket
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: SmartProBonoPocket/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Align Expo SDK 54 patch versions
        run: npx expo install --fix

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Save Expo-aligned package files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-aligned-package-files
          path: |
            SmartProBonoPocket/package.json
            SmartProBonoPocket/package-lock.json
          if-no-files-found: error
