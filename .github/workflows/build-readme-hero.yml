name: Build SmartProBono README hero

on:
  push:
    branches:
      - chore/spb-readme-hero
    paths:
      - '.github/workflows/build-readme-hero.yml'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/spb-readme-hero

      - name: Reconstruct exact approved image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reference/screenshots
          cat .github/readme-hero/part-*.b64 | base64 --decode > docs/reference/screenshots/github-social-preview.jpg
          test "$(wc -c < docs/reference/screenshots/github-social-preview.jpg)" -eq 43495
          echo "5311ec53dc097655344b2479aceef8c884874ccecfb9314cae2a27b61d381cad  docs/reference/screenshots/github-social-preview.jpg" | sha256sum --check -
          file docs/reference/screenshots/github-social-preview.jpg | grep -q 'JPEG image data'

      - name: Put hero at top of README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          hero = """<p align="center">
            <img src="docs/reference/screenshots/github-social-preview.jpg" alt="SmartProBono personal safety companion overview" width="100%" />
          </p>
          """
          if "docs/reference/screenshots/github-social-preview.jpg" not in text:
              title = "# SmartProBono — Mobile Safety Companion\n"
              if title not in text:
                  raise SystemExit("README title not found")
              text = text.replace(title, title + "\n" + hero + "\n", 1)
              path.write_text(text)

      - name: Remove staging files
        shell: bash
        run: |
          rm -rf .github/readme-hero
          rm -f .github/workflows/build-readme-hero.yml

      - name: Commit finished README hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add SmartProBono safety README hero [skip netlify]"
          git push origin HEAD:chore/spb-readme-hero
